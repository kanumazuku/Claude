[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-council"
version = "0.1.0"
description = "Claude、GPT、Gemini、ローカルLLMが対等に議論しながら、プロンプトへの回答を共同で作り上げるWebアプリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "anthropic>=2.13",
    "openai>=3.0",
    "google-genai>=3.0",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ai_council*"]

[tool.setuptools.package-data]
ai_council = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
